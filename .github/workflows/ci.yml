name: Homebrew Tap CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate formulae
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          brew --version
          swift --version

      - name: Validate tap
        run: make smoke
